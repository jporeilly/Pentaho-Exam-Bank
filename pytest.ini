[pytest]
# Collect from tests/ only.
#
# Without this, `pytest` from the repo root walks everything below it -
# including desktop\src-tauri\vendor\python, the 148 MB Python runtime the
# installer vendors. That tree contains site-packages, site-packages
# contains pywin32, and pywin32 ships test modules that do real work at
# import: win32comext\taskscheduler\test\test_addtask.py takes the whole
# interpreter down with "Windows fatal exception: access violation" before
# a single test of this app has run.
#
# Scoping collection is the fix rather than ignoring that one file,
# because the vendored tree is somebody else's code entire and none of it
# is ours to run.
testpaths = tests

# Belt and braces for anyone who runs `pytest <path>` explicitly and
# lands inside one of these.
norecursedirs = desktop venv frontend assets .git __pycache__ .pytest_cache
